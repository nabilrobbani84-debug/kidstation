services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kidstation-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_NAME: Kidstation
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: logistik_nestle
      DB_USERNAME: root
      DB_PASSWORD: kidstation_root
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kidstation

  mysql:
    image: mysql:8.4
    container_name: kidstation-mysql
    restart: unless-stopped
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: kidstation_root
      MYSQL_DATABASE: logistik_nestle
    volumes:
      - kidstation-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pkidstation_root"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kidstation

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: kidstation-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kidstation

volumes:
  kidstation-mysql-data:
    name: kidstation-mysql-data

networks:
  kidstation:
    name: kidstation-net
